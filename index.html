<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test.jpg 二维码</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --subtext: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 24px;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 28px;
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .image-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .image-wrapper img {
            width: 100%;
            display: block;
            border-radius: 12px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--subtext);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
        }

        .form-group textarea {
            min-height: 60px;
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .qr-container {
            padding: 12px;
            background: #fff;
            border-radius: 12px;
        }

        .qr-container canvas,
        .qr-container img {
            display: block;
        }

        .qr-tip {
            font-size: 13px;
            color: var(--subtext);
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-accent {
            background: var(--accent);
            color: #0f172a;
        }

        .btn-accent:hover {
            filter: brightness(1.1);
        }

        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            margin-top: 8px;
        }

        .btn-outline:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .url-display {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border-radius: 8px;
            font-size: 12px;
            color: var(--subtext);
            word-break: break-all;
            text-align: center;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧：图片预览 + 文字编辑 -->
        <div class="card">
            <div class="card-title">🖼️ 图片预览</div>
            <div class="image-wrapper">
                <img id="previewImage" src="test.jpg" alt="预览图片" />
            </div>
            <div class="form-group">
                <label>📝 附加文字（可选，扫码后在页面下方显示）</label>
                <textarea id="textInput" placeholder="输入文字..."></textarea>
            </div>
            <div class="form-group">
                <label>� 图片链接（默认使用 test.jpg）</label>
                <input type="text" id="imageInput" value="test.jpg" />
            </div>
            <button class="btn btn-accent" id="refreshBtn">🔄 刷新二维码</button>
        </div>

        <!-- 右侧：二维码 -->
        <div class="card">
            <div class="card-title">📱 扫码查看图片</div>
            <div class="qr-section">
                <div class="qr-container" id="qrCode"></div>
                <div class="qr-tip">扫描二维码直接查看图片</div>
                <div class="url-display" id="urlDisplay"></div>
                <button class="btn btn-outline" id="copyBtn">📋 复制图片链接</button>
            </div>
        </div>
    </div>

    <script>
        var BASE = 'https://dingzishan05.github.io/image/';
        // 本地预览时回退
        if (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            BASE = window.location.href.replace(/index\.html$/, '');
        }

        var currentUrl = '';

        function getImageUrl(filename) {
            if (/^https?:\/\//i.test(filename)) return filename;
            return BASE + filename;
        }

        function getPageUrl(image, text) {
            var url = new URL(BASE + 'index.html');
            if (image) url.searchParams.set('image', image);
            if (text) url.searchParams.set('text', text);
            return url.toString();
        }

        function initQR() {
            var imageVal = document.getElementById('imageInput').value.trim() || 'test.jpg';
            var textVal = document.getElementById('textInput').value.trim();

            currentUrl = getPageUrl(imageVal, textVal);

            var qrCode = document.getElementById('qrCode');
            qrCode.innerHTML = '';
            new QRCode(qrCode, {
                text: currentUrl,
                width: 220,
                height: 220,
                colorDark: '#0f172a',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });

            document.getElementById('urlDisplay').textContent = currentUrl;

            // 更新预览图
            var img = document.getElementById('previewImage');
            img.src = getImageUrl(imageVal);
        }

        // 从 URL 参数加载（扫码访问时）
        function loadFromParams() {
            var params = new URLSearchParams(window.location.search);
            var text = params.get('text');
            var image = params.get('image');

            if (!text && !image) return;

            if (image) {
                document.getElementById('previewImage').src = getImageUrl(image);
            }
            if (text) {
                var el = document.createElement('div');
                el.style.cssText = 'margin-top:16px;padding:16px;background:#1e293b;border-radius:10px;font-size:15px;line-height:1.6;color:#f1f5f9;text-align:center;word-break:break-word;border:1px solid #334155;';
                el.textContent = text;
                document.querySelector('.container').parentElement.appendChild(el);
            }
            // 扫码模式下隐藏编辑区
            var cards = document.querySelectorAll('.card');
            if (cards.length >= 2) {
                cards[0].style.display = 'none';
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', initQR);

        document.getElementById('imageInput').addEventListener('input', function() {
            var img = document.getElementById('previewImage');
            img.src = getImageUrl(this.value.trim() || 'test.jpg');
        });

        document.getElementById('copyBtn').addEventListener('click', function() {
            if (!currentUrl) return;
            navigator.clipboard.writeText(currentUrl).then(function() {
                var btn = document.getElementById('copyBtn');
                btn.textContent = '✅ 已复制！';
                setTimeout(function() { btn.textContent = '📋 复制图片链接'; }, 2000);
            });
        });

        initQR();
        loadFromParams();
    </script>
</body>
</html>
