<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL 转二维码</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --subtext: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid var(--border);
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--accent);
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--subtext);
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            background: var(--accent);
            color: #0f172a;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 16px;
        }

        .qr-container {
            padding: 12px;
            background: #fff;
            border-radius: 12px;
        }

        .qr-container canvas,
        .qr-container img {
            display: block;
        }

        .qr-tip {
            font-size: 13px;
            color: var(--subtext);
            text-align: center;
        }

        .url-display {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border-radius: 8px;
            font-size: 12px;
            color: var(--subtext);
            word-break: break-all;
            text-align: center;
            border: 1px solid var(--border);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">URL 转二维码</div>

        <div class="form-group">
            <label>输入链接（图片URL或任意网址）</label>
            <input type="text" id="urlInput" placeholder="例如：https://example.com/image.jpg" />
        </div>

        <button class="btn" id="generateBtn">生成二维码</button>

        <div class="qr-section" id="qrSection" style="display:none;">
            <div class="qr-container" id="qrCode"></div>
            <div class="qr-tip">扫描二维码直接访问链接</div>
            <div class="url-display" id="urlDisplay"></div>
        </div>
    </div>

    <script>
        var qrCodeInstance = null;

        function generateQR() {
            var url = document.getElementById('urlInput').value.trim();
            if (!url) {
                alert('请输入一个URL链接');
                return;
            }

            var qrSection = document.getElementById('qrSection');
            var qrCode = document.getElementById('qrCode');
            var urlDisplay = document.getElementById('urlDisplay');

            qrSection.style.display = 'flex';
            qrCode.innerHTML = '';

            qrCodeInstance = new QRCode(qrCode, {
                text: url,
                width: 240,
                height: 240,
                colorDark: '#0f172a',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });

            urlDisplay.textContent = url;
        }

        document.getElementById('generateBtn').addEventListener('click', generateQR);

        document.getElementById('urlInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') generateQR();
        });
    </script>
</body>
</html>
