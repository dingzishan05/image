<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --subtext: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid var(--border);
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--accent);
            text-align: center;
        }

        .mode-switch {
            display: flex;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--subtext);
            text-align: center;
            transition: all 0.2s;
            outline: none;
        }

        .mode-btn:first-child {
            border-radius: 8px 0 0 8px;
            border-right: none;
        }

        .mode-btn:last-child {
            border-radius: 0 8px 8px 0;
        }

        .mode-btn.active {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--subtext);
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            background: var(--accent);
            color: #0f172a;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 16px;
        }

        .qr-container {
            padding: 12px;
            background: #fff;
            border-radius: 12px;
        }

        .qr-container canvas,
        .qr-container img {
            display: block;
        }

        .qr-tip {
            font-size: 13px;
            color: var(--subtext);
            text-align: center;
        }

        .url-display {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border-radius: 8px;
            font-size: 12px;
            color: var(--subtext);
            word-break: break-all;
            text-align: center;
            border: 1px solid var(--border);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">二维码生成器</div>

        <div class="mode-switch" id="modeSwitch">
            <button class="mode-btn active" data-mode="url">URL</button>
            <button class="mode-btn" data-mode="text">文字</button>
        </div>

        <div class="form-group">
            <label id="inputLabel">输入链接（图片URL或任意网址）</label>
            <input type="text" id="urlInput" placeholder="例如：https://example.com/image.jpg" />
        </div>

        <button class="btn" id="generateBtn">生成二维码</button>

        <div class="qr-section" id="qrSection" style="display:none;">
            <div class="qr-container" id="qrCode"></div>
            <div class="qr-tip" id="qrTip">扫描二维码直接访问链接</div>
            <div class="url-display" id="urlDisplay"></div>
        </div>
    </div>

    <script>
        var qrCodeInstance = null;
        var currentMode = 'url';

        var modeBtns = document.querySelectorAll('.mode-btn');
        var inputLabel = document.getElementById('inputLabel');
        var qrTip = document.getElementById('qrTip');
        var urlInput = document.getElementById('urlInput');

        modeBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                var mode = this.getAttribute('data-mode');
                if (currentMode === mode) return;

                modeBtns.forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                currentMode = mode;

                if (mode === 'url') {
                    inputLabel.textContent = '输入链接（图片URL或任意网址）';
                    urlInput.placeholder = '例如：https://example.com/image.jpg';
                    qrTip.textContent = '扫描二维码直接访问链接';
                } else {
                    inputLabel.textContent = '输入文字或编号';
                    urlInput.placeholder = '例如：产品编号 A001';
                    qrTip.textContent = '扫描二维码查看文字内容';
                }
            });
        });

        function generateQR() {
            var input = urlInput.value.trim();

            if (currentMode === 'url') {
                if (!input) {
                    alert('请输入一个URL链接');
                    return;
                }
            } else {
                if (!input) {
                    alert('请输入文字或编号');
                    return;
                }
            }

            var qrSection = document.getElementById('qrSection');
            var qrCode = document.getElementById('qrCode');
            var urlDisplay = document.getElementById('urlDisplay');

            qrSection.style.display = 'flex';
            qrCode.innerHTML = '';

            qrCodeInstance = new QRCode(qrCode, {
                text: input,
                width: 240,
                height: 240,
                colorDark: '#0f172a',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });

            urlDisplay.textContent = input;
        }

        document.getElementById('generateBtn').addEventListener('click', generateQR);

        urlInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') generateQR();
        });
    </script>
</body>
</html>
